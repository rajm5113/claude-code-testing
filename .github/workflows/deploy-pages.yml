name: Deploy Game to GitHub Pages

on:
  push:
    branches: ["claude/wonderful-turing-cciwya"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game folder as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./game

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
