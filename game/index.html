<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Box Bros — A Mario-style Platformer</title>
<style>
  :root { --bg1:#1a1033; --bg2:#0d0820; --accent:#ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(1200px 600px at 50% -10%, #2a1a55, var(--bg1) 40%, var(--bg2));
    color: #fff; font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }
  h1 {
    margin: 14px 0 4px; font-size: clamp(20px, 4vw, 34px); letter-spacing: 1px;
    text-shadow: 0 3px 0 #c1121f, 0 6px 12px rgba(0,0,0,.5);
  }
  .sub { margin: 0 0 10px; opacity: .7; font-size: 13px; }
  #wrap {
    position: relative; width: min(96vw, 960px);
    box-shadow: 0 18px 60px rgba(0,0,0,.55); border-radius: 14px; overflow: hidden;
    border: 3px solid rgba(255,255,255,.12);
  }
  canvas { display: block; width: 100%; height: auto; background: #87ceeb; touch-action: none; }
  /* On-screen touch controls */
  #touch { display: none; width: min(96vw, 960px); margin-top: 12px; justify-content: space-between; }
  #touch .group { display: flex; gap: 12px; }
  .btn {
    width: 74px; height: 74px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.14); color: #fff; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); box-shadow: 0 6px 16px rgba(0,0,0,.4);
  }
  .btn:active { background: var(--accent); color: #222; transform: translateY(2px); }
  #jump { width: 92px; height: 92px; background: rgba(255,210,63,.25); }
  .hint { margin: 12px 0 22px; opacity: .65; font-size: 13px; text-align: center; line-height: 1.7; }
  kbd {
    background: #2a2150; border: 1px solid #4a3f7a; border-bottom-width: 3px;
    border-radius: 6px; padding: 2px 8px; font-size: 12px; margin: 0 1px;
  }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
  <h1>🍄 SUPER BOX BROS</h1>
  <p class="sub">A hand-built Mario-style platformer · 5 levels</p>

  <div id="wrap">
    <canvas id="game" width="960" height="600"></canvas>
  </div>

  <div id="touch">
    <div class="group">
      <button class="btn" id="left" aria-label="Move left">◀</button>
      <button class="btn" id="right" aria-label="Move right">▶</button>
    </div>
    <div class="group">
      <button class="btn" id="jump" aria-label="Jump">⤴</button>
    </div>
  </div>

  <p class="hint">
    <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move &nbsp;·&nbsp;
    <kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> to jump &nbsp;·&nbsp;
    <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>Enter</kbd> to start / advance<br>
    Stomp enemies from above · grab coins · hit <b>?</b> blocks · reach the 🚩 flag
  </p>

  <script src="game.js"></script>
</body>
</html>
